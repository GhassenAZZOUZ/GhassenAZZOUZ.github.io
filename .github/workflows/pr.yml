name: PR Preview

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, closed]

permissions:
  contents: write
  pull-requests: write

jobs:
  deploy-preview:
    if: github.event.action != 'closed'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Build preview
        run: npm run build
        env:
          BASE_PATH: /pr-${{ github.event.pull_request.number }}/

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: pr-${{ github.event.pull_request.number }}-build
          path: dist
          retention-days: 3

      - name: Deploy preview
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          destination_dir: pr-${{ github.event.pull_request.number }}
          keep_files: true

      - name: Comment preview URL
        uses: actions/github-script@v7
        with:
          script: |
            const pr  = context.payload.pull_request.number
            const sha = context.payload.pull_request.head.sha.substring(0, 7)
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: `✅ **Preview deployed** for \`${sha}\`\n\n🔗 https://ghassenazzouz.github.io/pr-${pr}/`
            })

  cleanup-preview:
    if: github.event.action == 'closed'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Remove preview directory
        run: |
          git fetch origin gh-pages 2>/dev/null || exit 0
          git checkout gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git rm -rf pr-${{ github.event.pull_request.number }} --ignore-unmatch
          git diff --staged --quiet || git commit -m "chore: remove preview for PR #${{ github.event.pull_request.number }}"
          git push origin gh-pages
