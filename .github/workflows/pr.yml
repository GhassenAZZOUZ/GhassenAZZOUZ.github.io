name: PR Build Check

on:
  pull_request:
    branches: [main]

permissions:
  pull-requests: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Build
        run: npm run build

      - name: Upload preview artifact
        uses: actions/upload-artifact@v4
        with:
          name: pr-${{ github.event.pull_request.number }}-build
          path: dist
          retention-days: 3

      - name: Comment build result
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const success  = '${{ job.status }}' === 'success'
            const icon     = success ? '✅' : '❌'
            const status   = success ? 'Build passed' : 'Build failed'
            const sha      = context.payload.pull_request.head.sha.substring(0, 7)
            const artifact = success
              ? `\n\n📦 Built artifact uploaded — download it from the [Actions run](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}) to preview locally.`
              : ''
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: `${icon} **${status}** for commit \`${sha}\`${artifact}`
            })
